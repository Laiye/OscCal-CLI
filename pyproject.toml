[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osccal"
version = "0.1.0"
description = "示波器自动校准 CLI 工具"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.9",
    "mypy>=1.10",
]

[project.scripts]
osccal = "osccal.cli:cli"

[tool.setuptools.packages.find]
include = ["osccal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["osccal.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # 行长由 ruff format 处理，不做硬性报错
    "B008",   # click 选项装饰器中的函数调用属于正常用法
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = [
    "osccal/core/types.py",
    "osccal/core/config.py",
    "osccal/core/config_validation.py",
    "osccal/core/scpi_trace.py",
]
ignore_missing_imports = true
warn_unused_ignores = true
